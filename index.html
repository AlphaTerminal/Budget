<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terry's Budget Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">

<body>
<style>
  :root{
    --border:#d8dce3;
    --border-strong:#9aa4b2;
    --radius:8px;
    --surface-1:#f7f8fa;
    --surface-2:#eef0f3;
    --surface-accent:#2563eb;
    --text-accent:#2563eb;
    --text-muted:#8a929e;
    --text-secondary:#5b6472;
    --text-success:#1a7f4e;
  }
  *{box-sizing:border-box}
  body{max-width:480px;margin:0 auto}
  .tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch;padding-bottom:2px;position:sticky;top:0;z-index:30;background:#fff;padding-top:4px}
  .tab{flex:0 0 auto;padding:7px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);cursor:pointer;font-size:13px;white-space:nowrap}
  .tab.active{background:var(--surface-1);border-color:var(--border-strong);font-weight:500}
  .tab-cog{font-size:15px;padding:7px 10px}
  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:sticky;top:39px;z-index:29;background:#fff;padding-bottom:6px}
  .add-toggle-btn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-accent,var(--text-accent));color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .addform{display:none;margin-top:10px;background:var(--surface-1);border-radius:12px;padding:0.75rem 0.85rem}
  .addform.show{display:block}
  .grp{background:var(--surface-1);border-radius:12px;padding:0.85rem 1rem;margin-bottom:10px}
  .grp h3{margin:0 0 8px;font-size:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
  .row label{font-size:13px;color:var(--text-secondary);flex:1;min-width:0}
  .row input{width:100px;text-align:right;flex:0 0 auto}
  .statement{background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  th,td{padding:7px 4px;border-bottom:0.5px solid var(--border);vertical-align:middle}
  th{color:var(--text-secondary);font-weight:500;font-size:11px;text-align:right;position:sticky;top:75px;background:#fff;z-index:28}
  .col-chk{width:22px;padding-right:0}
  .col-date{width:78px;text-align:left;font-size:11px;color:var(--text-muted);white-space:nowrap;cursor:pointer}
  .col-date:active{background:var(--surface-1)}
  .col-item{text-align:left;overflow-wrap:break-word}
  .col-amt{width:64px;text-align:right;white-space:nowrap;padding-right:4px;cursor:pointer}
  .col-amt:active{background:var(--surface-1)}
  .col-bal{width:64px;text-align:right;white-space:nowrap;padding-left:2px;color:var(--text-muted);font-size:12px}
  .col-del{width:26px;padding-left:2px;padding-right:4px;text-align:center}
  .rm{border:none;background:none;font-size:14px;cursor:pointer;padding:2px;line-height:1;opacity:0.55}
  .rm:active{opacity:1}
  th.col-date,th.col-item{text-align:left}
  tr.summary td{font-weight:500;background:var(--surface-1)}
  .pos{color:var(--text-success)}
  .paid .col-item{text-decoration:line-through;color:var(--text-muted)}
  .paid .col-amt{color:var(--text-muted)}
  tbody tr{transition:opacity 0.25s ease}
  tbody tr.fading{opacity:0}
  tbody tr.hidden{display:none}
  .statement.show-paid tbody tr.hidden{display:table-row;opacity:0.6}
  .showpaid-toggle{border:none;background:none;color:var(--text-accent);font-size:12px;padding:6px 0;cursor:pointer}
  .chk{width:16px;height:16px;margin:0}
  .addrow{display:flex;gap:8px;margin-bottom:8px}
  .addrow:last-child{margin-bottom:0}
  .add-item{flex:1;min-width:0}
  .add-date{flex:0 0 132px}
  .add-type{flex:0 0 92px}
  .add-amt{flex:1;min-width:0}
  .add-btn{flex:0 0 auto;padding:0 14px}
  .save-note{font-size:12px;color:var(--text-muted);margin-top:10px}
  .backup-bar{display:flex;gap:8px;margin-bottom:12px}
  .backup-bar button, .backup-bar .import-label{flex:1;text-align:center;padding:7px 10px;font-size:13px;cursor:pointer}
  .import-label input{display:none}
  .sync-help{font-size:12px;color:var(--text-secondary);margin:0 0 8px}
  .sync-status{font-size:12px;color:var(--text-muted);margin-left:8px}
  .inline-input{width:100%;font-size:12px;padding:2px;border:1px solid var(--border-strong);border-radius:4px}
  .edit-hint{font-size:11px;color:var(--text-muted);text-align:center;padding:8px 0 2px}
  .tab-arrow{flex:0 0 auto;padding:7px 8px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);cursor:pointer;font-size:13px}
  .tab-arrow:disabled{opacity:0.3;cursor:default}
</style>
<div class="tabs" id="tabs"></div>
<div id="panels"></div>
<p class="save-note" id="saveNote">Tap any date or amount to edit it directly. Changes save to this browser automatically.</p>

function keyOf(year, month){ return year + '-' + String(month).padStart(2,'0'); }
function parseKey(key){ const [y,m] = key.split('-').map(Number); return {year:y, month:m}; }
function shiftKey(key, delta){
  const {year,month} = parseKey(key);
  const dt = new Date(year, (month-1)+delta, 1);
  return keyOf(dt.getFullYear(), dt.getMonth()+1);
}
function keyLabel(key){
  const {year,month} = parseKey(key);
  const dt = new Date(year, month-1, 1);
  return dt.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function keyForDate(dateObj){
  return keyOf(dateObj.getFullYear(), dateObj.getMonth()+1);
}

const EPOCH_KEY = "2026-07";
const OLD_NAME_TO_KEY = {
  "July 2026":"2026-07","August 2026":"2026-08","September 2026":"2026-09",
  "October 2026":"2026-10","November 2026":"2026-11","December 2026":"2026-12"
};

function migrateTransactions(obj){
  const out = {};
  for(const k in obj){
    const newKey = OLD_NAME_TO_KEY[k] || k; // already-canonical keys pass through unchanged
    out[newKey] = obj[k];
  }
  return out;
}

function d(s){ const [dd,mm,yy] = s.split('/'); return new Date(yy,mm-1,dd); }
function toDDMMYYYY(isoDate){
  const [y,m,dd] = isoDate.split('-');
  return dd+'/'+m+'/'+y;
}
function toISO(ddmmyyyy){
  if(!ddmmyyyy) return '';
  const [dd,m,y] = ddmmyyyy.split('/');
  return y+'-'+m+'-'+dd;
}

let nextIdCounter = 10000;
function newId(){ return 't'+(nextIdCounter++); }

// Find the most recent seeded month before `key` to use as a template for
// auto-generating a brand new month's recurring weekly pattern.
function findTemplateMonth(beforeKey){
  let probe = shiftKey(beforeKey, -1);
  let guard = 0;
  while(guard < 240){ // don't loop forever; ~20 years back is plenty
    if(S.transactions[probe] && S.transactions[probe].length){
      return probe;
    }
    if(probe <= EPOCH_KEY) break;
    probe = shiftKey(probe, -1);
    guard++;
  }
  return null;
}

function thursdaysInMonth(year, month){
  const days = [];
  const lastDay = new Date(year, month, 0).getDate();
  for(let day=1; day<=lastDay; day++){
    const dt = new Date(year, month-1, day);
    if(dt.getDay() === 4) days.push(day); // Thursday
  }
  return days;
}

// Auto-generate a default weekly recurring pattern (Payday + 3 bills + food shop)
// for a month that doesn't have any data yet, so scrolling forward/backward
// indefinitely always shows something sensible rather than a blank page.
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function swapMonthNameInText(text, newMonthName){
  for(const mn of MONTH_NAMES){
    if(text.includes(mn)) return text.split(mn).join(newMonthName);
  }
  return text;
}

function ensureMonthSeeded(key, opening){
  if(S.transactions[key] && S.transactions[key].length) return;
  const {year, month} = parseKey(key);
  const templateKey = findTemplateMonth(key);

  // No history at all (shouldn't normally happen since July is always seeded) —
  // fall back to a bare weekly pattern.
  if(!templateKey){
    const rows = [];
    thursdaysInMonth(year, month).forEach(day=>{
      const dateStr = String(day).padStart(2,'0')+'/'+String(month).padStart(2,'0')+'/'+year;
      rows.push({id:newId(), date:dateStr, item:"Payday", amt:535.54, bold:false, removable:true});
      rows.push({id:newId(), date:dateStr, item:"United Utilities", amt:-21, bold:false, removable:true});
      rows.push({id:newId(), date:dateStr, item:"Child Maintenance", amt:-34, bold:false, removable:true});
      rows.push({id:newId(), date:dateStr, item:"Council Tax", amt:-36, bold:false, removable:true});
      rows.push({id:newId(), date:dateStr, item:"Food shop", amt:-100, bold:false, removable:true});
    });
    S.transactions[key] = rows;
    return;
  }

  const WEEKLY_ITEMS = ["Payday","United Utilities","Child Maintenance","Council Tax","Food shop"];
  const templateRows = S.transactions[templateKey];
  const newMonthName = new Date(year, month-1, 1).toLocaleDateString('en-GB',{month:'long'});
  const newLastDay = new Date(year, month, 0).getDate();

  // Group the template month's weekly items (payday + bills + food) by date,
  // in order, so each "week" in the new month can reuse that week's amounts.
  const byDate = {};
  templateRows.forEach(r=>{ (byDate[r.date] = byDate[r.date]||[]).push(r); });
  const templateWeekDates = Object.keys(byDate)
    .filter(dt => byDate[dt].some(r=>r.item==='Payday'))
    .sort((a,b)=> d(a)-d(b));
  const weeklyTemplates = templateWeekDates.map(dt =>
    WEEKLY_ITEMS.map(item => {
      const found = byDate[dt].find(r=>r.item===item);
      return found ? found.amt : null;
    })
  );

  const rows = [];
  const newThursdays = thursdaysInMonth(year, month);
  newThursdays.forEach((day,i)=>{
    const dateStr = String(day).padStart(2,'0')+'/'+String(month).padStart(2,'0')+'/'+year;
    const weekVals = weeklyTemplates[i] || weeklyTemplates[weeklyTemplates.length-1] || [535.54,-21,-34,-36,-100];
    WEEKLY_ITEMS.forEach((item, idx)=>{
      if(weekVals[idx] !== null && weekVals[idx] !== undefined){
        rows.push({id:newId(), date:dateStr, item, amt:weekVals[idx], bold:false, removable:true});
      }
    });
  });

  // Copy every other (non-weekly) entry from the template month — rent, nursery,
  // Utility Warehouse, Universal Credit, withdrawals, one-off purchases, anything
  // manually added — shifting each to the same day-of-month, clamped to however
  // many days the new month actually has (so "last day of month" items like
  // nursery and UW automatically land on the new month's real last day).
  templateRows.forEach(r=>{
    if(WEEKLY_ITEMS.includes(r.item)) return;
    const origDay = d(r.date).getDate();
    const newDay = Math.min(origDay, newLastDay);
    const newDateStr = String(newDay).padStart(2,'0')+'/'+String(month).padStart(2,'0')+'/'+year;
    rows.push({id:newId(), date:newDateStr, item:swapMonthNameInText(r.item, newMonthName), amt:r.amt, bold:r.bold, removable:true});
  });

  S.transactions[key] = rows;

  // Auto-balance: nudge the month's biggest cash withdrawal up or down so the
  // closing balance lands within the usual £0–£65 target range, same approach
  // used when the original six months were set up by hand.
  if(typeof opening === 'number'){
    balanceMonthToTarget(key, opening);
  }
}

function balanceMonthToTarget(key, opening){
  const TARGET_MIN = 0, TARGET_MAX = 65;
  const targetMid = 20 + Math.random()*30; // land comfortably inside 0–65

  let raw = getMonthRowsRaw(key, opening);
  if(raw.closing >= TARGET_MIN && raw.closing <= TARGET_MAX) return;

  const list = S.transactions[key];
  const withdrawals = list.filter(r=>r.item==='Cash withdrawal').sort((a,b)=> d(b.date)-d(a.date)); // latest first
  if(withdrawals.length === 0) return;

  let remaining = Math.round((raw.closing - targetMid)/5)*5; // positive = need MORE withdrawn; negative = need LESS withdrawn

  if(remaining > 0){
    // Closing too high — increase the latest withdrawal to absorb all of it.
    withdrawals[0].amt -= remaining;
  } else if(remaining < 0){
    // Closing too low — claw money back by reducing withdrawals toward £0,
    // moving through as many as needed (can't un-withdraw below zero on any one).
    let need = -remaining; // positive amount we need to free up
    for(const w of withdrawals){
      if(need <= 0) break;
      const available = -w.amt; // how much this withdrawal could give back
      const take = Math.min(available, need);
      w.amt += take;
      need -= take;
    }
    // If still short after zeroing every withdrawal, that's a genuine shortfall
    // this month (expenses simply exceed income) — leave as-is rather than
    // fabricating money that isn't there.
  }
}

function getMonthRowsRaw(key, opening){
  const list = S.transactions[key] || [];
  const sorted = list.slice().sort((a,b)=> d(a.date)-d(b.date));
  let bal = opening;
  sorted.forEach(r=>{ bal += r.amt; });
  return {closing: bal};
}

function getMonthRows(key, opening){
  ensureMonthSeeded(key, opening);
  const list = S.transactions[key] || [];
  const sorted = list
    .map((r,i)=>({...r, _idx:i, _d:d(r.date)}))
    .sort((a,b)=> a._d-b._d || a._idx-b._idx);
  let bal = opening;
  const withBal = sorted.map(r=>{
    bal += r.amt;
    const {_idx,_d,...rest} = r;
    return {...rest, bal};
  });
  return {rows: withBal, closing: bal};
}

// Walk sequentially from the epoch month up to (and including) `uptoKey`,
// seeding any months that don't exist yet, so the opening balance for any
// month — however far in the future — is always correct.
function computeChain(uptoKey){
  if(uptoKey < EPOCH_KEY) uptoKey = EPOCH_KEY;
  const order = [];
  let k = EPOCH_KEY;
  const out = {};
  let opening = S.start_balance;
  while(true){
    const res = getMonthRows(k, opening);
    out[k] = res;
    order.push(k);
    opening = res.closing;
    if(k === uptoKey) break;
    k = shiftKey(k, 1);
  }
  return {order, data: out};
}

function findTxn(monthKey, id){
  const list = S.transactions[monthKey] || [];
  const idx = list.findIndex(t=>t.id===id);
  return {list, idx};
}

function moveTxnIfMonthChanged(fromKey, id){
  const {list, idx} = findTxn(fromKey, id);
  if(idx === -1) return fromKey;
  const txn = list[idx];
  const fd = d(txn.date);
  const correctKey = keyForDate(fd);
  if(correctKey !== fromKey){
    list.splice(idx,1);
    ensureMonthSeeded(correctKey);
    if(!S.transactions[correctKey]) S.transactions[correctKey] = [];
    S.transactions[correctKey].push(txn);
    return correctKey;
  }
  return fromKey;
}

let syncStatus = '';

async function cloudPush(){
  if(!S.jsonbin_key) return;
  const toSave = S;
  try{
    if(!S.jsonbin_id){
      const res = await fetch('https://api.jsonbin.io/v3/b', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':S.jsonbin_key,'X-Bin-Name':'terrys-budget'},
        body: JSON.stringify(toSave)
      });
      if(!res.ok) throw new Error('Create bin failed: '+res.status);
      const data = await res.json();
      S.jsonbin_id = data.metadata.id;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){}
      syncStatus = 'Synced (new cloud box created)';
    } else {
      const res = await fetch('https://api.jsonbin.io/v3/b/'+S.jsonbin_id, {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':S.jsonbin_key},
        body: JSON.stringify(toSave)
      });
      if(!res.ok) throw new Error('Update failed: '+res.status);
      syncStatus = 'Synced just now';
    }
  }catch(e){
    console.error('Cloud sync failed:', e);
    syncStatus = 'Cloud sync failed — saved locally only';
  }
  updateSyncStatusUI();
}

async function cloudPull(){
  if(!S.jsonbin_key || !S.jsonbin_id) return false;
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+S.jsonbin_id+'/latest', {
      headers:{'X-Master-Key':S.jsonbin_key}
    });
    if(!res.ok) throw new Error('Fetch failed: '+res.status);
    const data = await res.json();
    S = {...DEFAULTS, ...data.record, jsonbin_key:S.jsonbin_key, jsonbin_id:S.jsonbin_id};
    S.transactions = migrateTransactions(S.transactions);
    syncStatus = 'Loaded from cloud';
    return true;
  }catch(e){
    console.error('Cloud pull failed:', e);
    syncStatus = 'Could not reach cloud — using local copy';
    return false;
  }
}

function updateSyncStatusUI(){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = syncStatus;
}

const STORAGE_KEY = 'terrys-budget-tracker-v4';
let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    }catch(e){
      console.error('Local save failed:', e);
    }
    await cloudPush();
  }, 300);
}

  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'terrys-budget-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const loaded = JSON.parse(e.target.result);
      S = {...DEFAULTS, ...loaded};
      S.transactions = migrateTransactions(S.transactions);
      saveState();
      renderAll();
    }catch(err){
      alert('That file could not be read as a backup.');
    }
  };
  reader.readAsText(file);
}

    <div class="row"><label>API key</label><input type="text" id="jsonbin-key" value="${S.jsonbin_key}" placeholder="paste your Master Key" style="width:180px"></div>
    <div class="row"><label>Cloud box ID</label><input type="text" id="jsonbin-id" value="${S.jsonbin_id}" placeholder="auto-filled after first sync" style="width:180px"></div>
    <div class="row"><button id="syncNowBtn">Sync now</button><span id="syncStatus" class="sync-status">${syncStatus}</span></div>
  </div>
  <div class="grp">
    <h3>Backup</h3>
    <div class="backup-bar">
      <button id="exportBtn">Export backup</button>
      <label class="import-label">Import backup<input type="file" id="importFile" accept="application/json"></label>
    </div>
  </div>
  <div class="grp">
    <h3>Recycle Bin ${S.recycleBin.length ? `(${S.recycleBin.length})` : ''}</h3>`;
  if(S.recycleBin.length === 0){
    html += `<p class="sync-help">Deleted entries show up here — the last 25 are kept, so you can restore one if you delete something by mistake.</p>`;
  } else {
    html += `<p class="sync-help">Last ${S.recycleBin.length} deleted entr${S.recycleBin.length>1?'ies':'y'}.</p>`;
    S.recycleBin.forEach((item, i)=>{
      const amtStr = fmt(item.amt);
      const fromLabel = keyLabel(item._fromMonth);
      html += `<div class="row"><label>${item.date} — ${item.item} (${amtStr}, was in ${fromLabel})</label><button data-restore="${i}" style="flex:0 0 auto;padding:4px 10px;font-size:12px">Restore</button></div>`;
    });
    html += `<div class="row" style="justify-content:flex-end;margin-top:6px"><button id="emptyBinBtn" style="padding:4px 10px;font-size:12px">Empty bin</button></div>`;
  }
  html += `</div>
  <div class="grp">
    <h3>Reset</h3>
    <p class="sync-help">If numbers ever look wrong or stuck on old data, use this to wipe everything saved in this browser and start completely fresh from the tracker's built-in defaults.</p>
    <button id="resetAllBtn" style="padding:6px 14px;font-size:13px">Reset to fresh defaults</button>
  </div>
  <p class="edit-hint">Everything else — bills, rent, withdrawals, one-off purchases — is edited directly on each month's page. Tap any date or amount there to change it.</p>`;
  return html;
}

function renderMonthPanel(key, data){
  const opening = S._opening_[key];
  let paidCount = 0;
  let html = `<div class="panel-header"><span></span><button class="add-toggle-btn" id="addToggleBtn" aria-label="Add new entry">+</button></div>`;
  html += '<div class="statement"><table>';
  html += `<thead><tr><th class="col-chk"></th><th class="col-date">Date</th><th class="col-item">Item</th><th class="col-amt">Amount</th><th class="col-bal">Balance</th><th class="col-del"></th></tr></thead><tbody>`;
  html += `<tr class="summary"><td class="col-chk"></td><td class="col-date"></td><td class="col-item">Balance brought forward</td><td class="col-amt"></td><td class="col-bal">${fmt(opening)}</td><td class="col-del"></td></tr>`;
  data.rows.forEach((r) => {
    const dt = d(r.date);
    const weekday = dt.toLocaleDateString('en-GB',{weekday:'short'});
    const dayMonth = dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const label = weekday + ' ' + dayMonth;
    const pkey = key+'|'+r.id;
    const isPaid = !!S.paid[pkey];
    if(isPaid) paidCount++;
    const amtClass = r.amt >= 0 ? 'pos' : '';
    html += `<tr class="${isPaid?'paid hidden':''}" data-id="${r.id}">`;
    html += `<td class="col-chk"><input type="checkbox" class="chk" data-key="${pkey}" ${isPaid?'checked':''} aria-label="Mark ${r.item} as paid"></td>`;
    html += `<td class="col-date" data-editcell="date" data-id="${r.id}">${label}</td>`;
    html += `<td class="col-item">${r.item}</td>`;
    html += `<td class="col-amt ${amtClass}" data-editcell="amt" data-id="${r.id}">${fmt(r.amt)}</td>`;
    html += `<td class="col-bal">${fmt(r.bal)}</td>`;
    html += `<td class="col-del"><button class="rm" data-remove="${r.id}" aria-label="Delete ${r.item}">🗑️</button></td>`;
    html += `</tr>`;
  });
  html += `<tr class="summary"><td class="col-chk"></td><td class="col-date"></td><td class="col-item">Closing balance</td><td class="col-amt"></td><td class="col-bal">${fmt(data.closing)}</td><td class="col-del"></td></tr>`;
  html += '</tbody></table></div>';
  html += `<button class="showpaid-toggle" data-showpaid="${key}" data-label="${paidCount} paid item${paidCount>1?'s':''} — show" style="${paidCount===0?'display:none':''}">${paidCount} paid item${paidCount>1?'s':''} — show</button>`;
  html += `<div class="addform" id="addFormBox">
    <div class="addrow">
      <input type="date" class="add-date" id="add-date-box">
      <input type="text" class="add-item" id="add-item-box" placeholder="e.g. New shoes from Asda">
    </div>
    <div class="addrow">
      <select class="add-type" id="add-type-box">
        <option value="out">Money out</option>
        <option value="in">Money in</option>
      </select>
      <input type="number" step="0.01" class="add-amt" id="add-amt-box" placeholder="Amount">
      <button class="add-btn" data-addmonth="${key}">Add</button>
    </div>
  </div>`;
  return html;
}

let currentTab = "Inputs"; // "Inputs" or a canonical month key like "2026-07"

function renderAll(){
  const viewKey = (currentTab === "Inputs") ? S.currentMonthKey : currentTab;
  const chain = computeChain(viewKey);
  S._opening_ = {};
  for(let i=0;i<chain.order.length;i++){
    const k = chain.order[i];
    const prevClosing = i===0 ? S.start_balance : chain.data[chain.order[i-1]].closing;
    S._opening_[k] = prevClosing;
  }

  const tabsEl = document.getElementById('tabs');
  const rawCenter = S.currentMonthKey;
  const minCenterForWindow = shiftKey(EPOCH_KEY, 2);
  const centerKey = rawCenter < minCenterForWindow ? minCenterForWindow : rawCenter;
  const windowKeys = [-2,-1,0,1,2].map(o=>shiftKey(centerKey,o));

  let tabsHtml = `<div class="tab tab-cog ${currentTab==='Inputs'?'active':''}" data-tab="Inputs" aria-label="Settings">⚙️</div>`;
  tabsHtml += `<button class="tab-arrow" id="prevMonthBtn" ${rawCenter<=EPOCH_KEY?'disabled':''} aria-label="Earlier months">◀</button>`;
  windowKeys.forEach(k=>{
    const active = (currentTab===k);
    tabsHtml += `<div class="tab ${active?'active':''}" data-tab="${k}">${keyLabel(k)}</div>`;
  });
  tabsHtml += `<button class="tab-arrow" id="nextMonthBtn" aria-label="Later months">▶</button>`;
  tabsEl.innerHTML = tabsHtml;

  tabsEl.querySelectorAll('.tab[data-tab]').forEach(t=>{
    t.onclick = ()=>{
      const key = t.dataset.tab;
      currentTab = key;
      if(key !== 'Inputs') S.currentMonthKey = key;
      renderAll();
    };
  });
  document.getElementById('prevMonthBtn').onclick = ()=>{
    const target = shiftKey(S.currentMonthKey, -1);
    if(target < EPOCH_KEY) return;
    S.currentMonthKey = target;
    if(currentTab !== 'Inputs') currentTab = target;
    renderAll();
  };
  document.getElementById('nextMonthBtn').onclick = ()=>{
    S.currentMonthKey = shiftKey(S.currentMonthKey, 1);
    if(currentTab !== 'Inputs') currentTab = S.currentMonthKey;
    renderAll();
  };

  const panelsEl = document.getElementById('panels');
  if(currentTab==="Inputs"){
    panelsEl.innerHTML = renderInputsPanel();
    panelsEl.querySelectorAll('input[data-key]').forEach(inp=>{
      inp.onchange = (e)=>{
        S[e.target.dataset.key] = parseFloat(e.target.value)||0;
        saveState();
        renderAll();
      };
    });
    document.getElementById('jsonbin-key').onchange = (e)=>{ S.jsonbin_key = e.target.value.trim(); saveState(); };
    document.getElementById('jsonbin-id').onchange = (e)=>{ S.jsonbin_id = e.target.value.trim(); saveState(); };
    document.getElementById('syncNowBtn').onclick = async ()=>{
      syncStatus = 'Syncing...';
      updateSyncStatusUI();
      if(S.jsonbin_id){
        const ok = await cloudPull();
        if(ok) renderAll();
      } else {
        await cloudPush();
        renderAll();
      }
    };
    document.getElementById('exportBtn').onclick = exportBackup;
    document.getElementById('importFile').onchange = (e)=>{
      if(e.target.files[0]) importBackup(e.target.files[0]);
    };
    panelsEl.querySelectorAll('button[data-restore]').forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.restore,10);
        const item = S.recycleBin[i];
        if(!item) return;
        const {_fromMonth, _deletedAt, ...txn} = item;
        ensureMonthSeeded(_fromMonth);
        if(!S.transactions[_fromMonth]) S.transactions[_fromMonth] = [];
        S.transactions[_fromMonth].push(txn);
        moveTxnIfMonthChanged(_fromMonth, txn.id);
        S.recycleBin.splice(i,1);
        saveState();
        renderAll();
      };
    });
    const emptyBinBtn = document.getElementById('emptyBinBtn');
    if(emptyBinBtn){
      emptyBinBtn.onclick = ()=>{
        S.recycleBin = [];
        saveState();
        renderAll();
      };
    }
    const resetAllBtn = document.getElementById('resetAllBtn');
    if(resetAllBtn){
      resetAllBtn.onclick = ()=>{
        const sure = confirm('This clears everything saved in this browser (all months, ticks, custom entries, cloud sync settings) and reloads the built-in defaults. This cannot be undone. Continue?');
        if(!sure) return;
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        try{ localStorage.removeItem('terrys-budget-tracker-v3'); }catch(e){}
        try{ localStorage.removeItem('terrys-budget-tracker-v2'); }catch(e){}
        try{ localStorage.removeItem('terrys-budget-tracker-v1'); }catch(e){}
        location.reload();
      };
    }
  } else {
    const key = currentTab;
    panelsEl.innerHTML = renderMonthPanel(key, chain.data[key]);

    panelsEl.querySelectorAll('input.chk[data-key]').forEach(cb=>{
      cb.onchange = (e)=>{
        const pkey = e.target.dataset.key;
        const tr = e.target.closest('tr');
        S.paid[pkey] = e.target.checked;
        saveState();
        if(e.target.checked){
          tr.classList.add('paid','fading');
          setTimeout(()=>{ if(S.paid[pkey]) tr.classList.add('hidden'); }, 260);
        } else {
          tr.classList.remove('hidden');
          void tr.offsetWidth;
          tr.classList.remove('fading','paid');
        }
        refreshPaidToggle(panelsEl);
      };
    });

    const showPaidBtn = panelsEl.querySelector('button[data-showpaid]');
    if(showPaidBtn){
      showPaidBtn.onclick = ()=>{
        const stmt = panelsEl.querySelector('.statement');
        const showing = stmt.classList.toggle('show-paid');
        showPaidBtn.textContent = showing ? 'Hide paid items' : showPaidBtn.dataset.label;
      };
    }

    panelsEl.querySelectorAll('button[data-remove]').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        const id = btn.dataset.remove;
        const {list, idx} = findTxn(key, id);
        if(idx !== -1){
          const [removed] = list.splice(idx,1);
          S.recycleBin.unshift({...removed, _fromMonth: key, _deletedAt: Date.now()});
          S.recycleBin = S.recycleBin.slice(0, 25);
        }
        saveState();
        renderAll();
      };
    });

    panelsEl.querySelectorAll('td[data-editcell]').forEach(cell=>{
      cell.onclick = ()=>{
        if(cell.querySelector('input')) return;
        const id = cell.dataset.id;
        const field = cell.dataset.editcell;
        const {list, idx} = findTxn(key, id);
        if(idx === -1) return;
        const txn = list[idx];
        const input = document.createElement('input');
        input.className = 'inline-input';
        if(field === 'date'){
          input.type = 'date';
          input.value = toISO(txn.date);
        } else {
          input.type = 'number';
          input.step = '0.01';
          input.value = txn.amt;
        }
        cell.textContent = '';
        cell.appendChild(input);
        input.focus();
        if(input.select) input.select();

        const commit = ()=>{
          if(field === 'date'){
            if(input.value){
              txn.date = toDDMMYYYY(input.value);
              moveTxnIfMonthChanged(key, id);
            }
          } else {
            const v = parseFloat(input.value);
            if(!isNaN(v)) txn.amt = v;
          }
          saveState();
          renderAll();
        };
        input.onblur = commit;
        input.onkeydown = (e)=>{
          if(e.key === 'Enter'){ input.blur(); }
          if(e.key === 'Escape'){ input.onblur = null; renderAll(); }
        };
      };
    });

    const addToggleBtn = panelsEl.querySelector('#addToggleBtn');
    const addFormBox = panelsEl.querySelector('#addFormBox');
    if(addToggleBtn && addFormBox){
      addToggleBtn.onclick = ()=>{
        const showing = addFormBox.classList.toggle('show');
        addToggleBtn.textContent = showing ? '×' : '+';
        addToggleBtn.setAttribute('aria-label', showing ? 'Close add entry form' : 'Add new entry');
      };
    }

    const addBtn = panelsEl.querySelector('button[data-addmonth]');
    if(addBtn){
      addBtn.onclick = ()=>{
        const m = addBtn.dataset.addmonth;
        const dateEl = document.getElementById('add-date-box');
        const itemEl = document.getElementById('add-item-box');
        const typeEl = document.getElementById('add-type-box');
        const amtEl = document.getElementById('add-amt-box');
        if(!dateEl.value || !itemEl.value || !amtEl.value) return;
        const amt = Math.abs(parseFloat(amtEl.value)) * (typeEl.value==='out' ? -1 : 1);
        ensureMonthSeeded(m);
        if(!S.transactions[m]) S.transactions[m] = [];
        const newTxn = {id:newId(), date:toDDMMYYYY(dateEl.value), item:itemEl.value, amt, bold:true, removable:true};
        S.transactions[m].push(newTxn);
        moveTxnIfMonthChanged(m, newTxn.id);
        saveState();
        renderAll();
      };
    }
  }
  adjustStickyOffsets();
}

function adjustStickyOffsets(){
  const tabsEl2 = document.getElementById('tabs');
  const panelHeader = document.querySelector('.panel-header');
  if(!tabsEl2) return;
  const tabsHeight = tabsEl2.getBoundingClientRect().height;
  if(panelHeader){
    panelHeader.style.top = tabsHeight + 'px';
    const panelHeaderHeight = panelHeader.getBoundingClientRect().height;
    document.querySelectorAll('th').forEach(th=>{
      th.style.top = (tabsHeight + panelHeaderHeight) + 'px';
    });
  }
}
window.addEventListener('resize', adjustStickyOffsets);

async function init(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      S = {...DEFAULTS, ...JSON.parse(raw)};
      S.transactions = migrateTransactions(S.transactions);
      if(!S.currentMonthKey || !/^\d{4}-\d{2}$/.test(S.currentMonthKey)){
        S.currentMonthKey = EPOCH_KEY;
      }
    } else {
      // check for older versions' storage keys and migrate their data across
      for(const oldKey of ['terrys-budget-tracker-v2','terrys-budget-tracker-v1']){
        const oldRaw = localStorage.getItem(oldKey);
        if(oldRaw){
          try{
            const oldData = JSON.parse(oldRaw);
            S = {...DEFAULTS, ...oldData};
            S.transactions = migrateTransactions(S.transactions || SEED_TRANSACTIONS);
            S.currentMonthKey = EPOCH_KEY;
            break;
          }catch(e){}
        }
      }
    }
  }catch(e){ console.error('Local load failed:', e); }
  if(S.jsonbin_key && S.jsonbin_id){
    await cloudPull();
  }
  renderAll();
}
init();
</script>

</html>
