<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terry's Budget Tracker</title>

<body>
<style>
  :root{
    --navy:#152B4E;
    --azure:#3667F0;
    --azure-tint:#EAF0FE;
    --mint:#0E9F6E;
    --mint-tint:#E5F8F0;
    --amber:#DA8B1F;
    --amber-tint:#FDF1DF;
    --rose-tint:#FCEBEC;
    --paper:#F4F6FA;
    --card:#FFFFFF;
    --ink:#152B4E;
    --ink-muted:#7C879B;
    --hairline:#E7EBF2;
    --border:#e7ebf2;
    --border-strong:#c3cbdb;
    --radius:10px;
    --surface-1:#F4F6FA;
    --surface-2:#F4F6FA;
    --surface-accent:#3667F0;
    --text-accent:#3667F0;
    --text-muted:#7C879B;
    --text-secondary:#5A6B8C;
    --text-success:#0E9F6E;
  }
  *{box-sizing:border-box}
  body{max-width:480px;margin:0 auto;background:var(--paper);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);padding:0 10px 24px;-webkit-font-smoothing:antialiased}
  .heading-font{font-family:'Space Grotesk',-apple-system,sans-serif}
  .tabular{font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch;padding-bottom:2px;position:sticky;top:0;z-index:30;background:var(--paper);padding-top:10px}
  .tab{flex:0 0 auto;padding:8px 14px;border:none;border-radius:999px;background:var(--card);color:var(--text-secondary);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 1px 2px rgba(21,43,78,0.06)}
  .tab.active{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(21,43,78,0.25)}
  .tab-cog{font-size:15px;padding:8px 12px;background:var(--card)}
  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:sticky;top:39px;z-index:29;background:var(--paper);padding-bottom:6px}
  .add-toggle-btn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:none;background:var(--azure);color:#fff;font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(54,103,240,0.35)}
  .addform{display:none;margin-top:10px;background:var(--card);border-radius:14px;padding:0.85rem 1rem;box-shadow:0 1px 3px rgba(21,43,78,0.08)}
  .addform.show{display:block}
  .grp{background:var(--card);border-radius:14px;padding:0.9rem 1.1rem;margin-bottom:10px;box-shadow:0 1px 3px rgba(21,43,78,0.08)}
  .grp h3{margin:0 0 8px;font-size:14px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--navy)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
  .row label{font-size:13px;color:var(--text-secondary);flex:1;min-width:0}
  .row input{width:100px;text-align:right;flex:0 0 auto;border:1px solid var(--hairline);border-radius:8px;padding:5px 8px;font-family:inherit}
  .statement{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(21,43,78,0.08)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  th,td{padding:10px 6px;border-bottom:1px solid var(--hairline);vertical-align:middle}
  th{color:var(--text-muted);font-weight:600;font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;text-align:right;position:sticky;top:75px;background:var(--card);z-index:28}
  .col-chk{width:22px;padding-right:0}
  .col-date{width:74px;text-align:left;font-size:11px;color:var(--text-muted);white-space:nowrap;cursor:pointer}
  .col-date:active{background:var(--azure-tint)}
  .col-item{text-align:left;overflow-wrap:break-word;font-weight:500}
  .col-amt{width:68px;text-align:right;white-space:nowrap;padding-right:4px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:500}
  .col-amt:active{background:var(--azure-tint)}
  .col-bal{width:66px;text-align:right;white-space:nowrap;padding-left:2px;color:var(--text-muted);font-size:12px;font-family:'Space Grotesk',sans-serif}
  .col-del{width:26px;padding-left:2px;padding-right:4px;text-align:center}
  .rm{border:none;background:none;font-size:14px;cursor:pointer;padding:2px;line-height:1;opacity:0.4}
  .rm:active{opacity:1}
  th.col-date,th.col-item{text-align:left}
  tr.summary td{font-weight:600;background:var(--azure-tint);color:var(--navy)}
  tr.summary .col-bal{color:var(--navy);font-size:14px}
  .pos{color:var(--text-success)}
  .paid .col-item{text-decoration:line-through;color:var(--text-muted)}
  .paid .col-amt{color:var(--text-muted)}
  tbody tr{transition:opacity 0.25s ease}
  tbody tr:active{background:var(--azure-tint)}
  tbody tr.fading{opacity:0}
  tbody tr.hidden{display:none}
  .statement.show-paid tbody tr.hidden{display:table-row;opacity:0.6}
  .showpaid-toggle{border:none;background:none;color:var(--text-accent);font-size:12px;padding:8px 4px;cursor:pointer;font-weight:500}
  .chk{width:17px;height:17px;margin:0;accent-color:var(--azure)}
  .icon-chip{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12px;margin-right:6px;flex:0 0 auto;vertical-align:middle}
  .item-text{display:inline-flex;align-items:center}
  .addrow{display:flex;gap:8px;margin-bottom:8px}
  .addrow:last-child{margin-bottom:0}
  .add-item{flex:1;min-width:0}
  .add-date{flex:0 0 132px}
  .add-type{flex:0 0 92px}
  .add-amt{flex:1;min-width:0}
  .add-btn{flex:0 0 auto;padding:0 16px;background:var(--azure);color:#fff;border:none;border-radius:8px;font-weight:500}
  input[type="date"],input[type="text"],input[type="number"],select{border:1px solid var(--hairline);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;background:var(--card);color:var(--ink)}
  .save-note{font-size:12px;color:var(--text-muted);margin-top:14px;text-align:center}
  .backup-bar{display:flex;gap:8px;margin-bottom:12px}
  .backup-bar button, .backup-bar .import-label{flex:1;text-align:center;padding:8px 10px;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--hairline);background:var(--card)}
  .import-label input{display:none}
  .sync-help{font-size:12px;color:var(--text-secondary);margin:0 0 8px}
  .sync-status{font-size:12px;color:var(--text-muted);margin-left:8px}
  .inline-input{width:100%;font-size:12px;padding:2px;border:1px solid var(--border-strong);border-radius:4px}
  .edit-hint{font-size:11px;color:var(--text-muted);text-align:center;padding:8px 0 2px}
  .tab-arrow{flex:0 0 auto;padding:8px 10px;border:none;border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;color:var(--text-secondary);box-shadow:0 1px 2px rgba(21,43,78,0.06)}
  .tab-arrow:disabled{opacity:0.3;cursor:default}
  .balance-hero{background:linear-gradient(135deg,var(--navy),#213E6E);border-radius:18px;padding:1.1rem 1.25rem;margin-bottom:14px;color:#fff;box-shadow:0 4px 16px rgba(21,43,78,0.25)}
  .balance-hero .hero-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.7;margin-bottom:4px}
  .balance-hero .hero-amount{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .balance-hero .hero-sub{font-size:12px;opacity:0.75;margin-top:6px}
  .home-wrap{padding-top:14px}
  .home-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:var(--navy);margin:2px 0 14px}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .home-box{background:var(--card);border-radius:16px;padding:1.2rem 1rem;box-shadow:0 1px 3px rgba(21,43,78,0.08);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .home-box:active{background:var(--azure-tint)}
  .home-box-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .home-box-label{font-weight:600;font-size:14px;color:var(--navy)}
  .home-box-sub{font-size:11px;color:var(--text-muted);margin-top:-6px}
  .back-bar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--paper);padding:10px 0 12px}
  .back-btn{border:none;background:var(--card);color:var(--navy);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;cursor:pointer;box-shadow:0 1px 2px rgba(21,43,78,0.06)}
  .back-bar-title{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--navy);font-size:16px}
  .chart-card{background:var(--card);border-radius:16px;padding:1rem 0.9rem;box-shadow:0 1px 3px rgba(21,43,78,0.08);margin-bottom:12px}
  .chart-card h3{margin:0 0 12px;font-size:14px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--navy)}
  .goal-card{background:var(--card);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 1px 3px rgba(21,43,78,0.08);margin-bottom:12px}
  .goal-card h4{margin:0 0 4px;font-size:15px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--navy)}
  .goal-meta{font-size:12px;color:var(--text-muted);margin-bottom:10px}
  .goal-progress-track{background:var(--hairline);border-radius:999px;height:8px;overflow:hidden;margin-bottom:8px}
  .goal-progress-fill{background:var(--azure);height:100%;border-radius:999px}
  .goal-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:10px}
  .goal-stats strong{color:var(--navy);font-family:'Space Grotesk',sans-serif}
  .goal-actions{display:flex;gap:8px}
  .goal-actions button{flex:1;padding:7px;font-size:12px;border-radius:8px;border:1px solid var(--hairline);background:var(--paper);cursor:pointer}
  .goal-actions button.primary{background:var(--azure);color:#fff;border:none}
  .goal-actions button.danger{color:#B3261E}
</style>

function keyOf(year, month){ return year + '-' + String(month).padStart(2,'0'); }
function parseKey(key){ const [y,m] = key.split('-').map(Number); return {year:y, month:m}; }
function shiftKey(key, delta){
  const {year,month} = parseKey(key);
  const dt = new Date(year, (month-1)+delta, 1);
  return keyOf(dt.getFullYear(), dt.getMonth()+1);
}
function keyLabel(key){
  const {year,month} = parseKey(key);
  const dt = new Date(year, month-1, 1);
  return dt.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function keyForDate(dateObj){
  return keyOf(dateObj.getFullYear(), dateObj.getMonth()+1);
}

const EPOCH_KEY = "2026-07";
const OLD_NAME_TO_KEY = {
  "July 2026":"2026-07","August 2026":"2026-08","September 2026":"2026-09",
  "October 2026":"2026-10","November 2026":"2026-11","December 2026":"2026-12"
};

function migrateTransactions(obj){
  const out = {};
  for(const k in obj){
    const newKey = OLD_NAME_TO_KEY[k] || k; // already-canonical keys pass through unchanged
    out[newKey] = obj[k];
  }
  return out;
}

function toISO(ddmmyyyy){
  if(!ddmmyyyy) return '';
  const [dd,m,y] = ddmmyyyy.split('/');

let nextIdCounter = 10000;
function newId(){ return 't'+(nextIdCounter++); }

// Find the most recent seeded month before `key` to use as a template for
// auto-generating a brand new month's recurring weekly pattern.
function findTemplateMonth(beforeKey){
  let probe = shiftKey(beforeKey, -1);
  let guard = 0;
  while(guard < 240){ // don't loop forever; ~20 years back is plenty
    if(S.transactions[probe] && S.transactions[probe].length){
      return probe;
    }
    if(probe <= EPOCH_KEY) break;
    probe = shiftKey(probe, -1);
    guard++;
  }
  return null;
}

function thursdaysInMonth(year, month){
  const days = [];
  const lastDay = new Date(year, month, 0).getDate();
  for(let day=1; day<=lastDay; day++){
    const dt = new Date(year, month-1, day);
    if(dt.getDay() === 4) days.push(day); // Thursday
  }
  return days;
}

// Auto-generate a default weekly recurring pattern (Payday + 3 bills + food shop)
// for a month that doesn't have any data yet, so scrolling forward/backward
// indefinitely always shows something sensible rather than a blank page.
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function swapMonthNameInText(text, newMonthName){
  for(const mn of MONTH_NAMES){
    if(text.includes(mn)) return text.split(mn).join(newMonthName);
  }
  return text;
}

  const newLastDay = new Date(year, month, 0).getDate();

  // Group the template month's weekly items (payday + bills + food) by date,
  // in order, so each "week" in the new month can reuse that week's amounts.
  const byDate = {};
  templateRows.forEach(r=>{ (byDate[r.date] = byDate[r.date]||[]).push(r); });
  const templateWeekDates = Object.keys(byDate)
    .filter(dt => byDate[dt].some(r=>r.item==='Payday'))
    .sort((a,b)=> d(a)-d(b));
  const weeklyTemplates = templateWeekDates.map(dt =>
    WEEKLY_ITEMS.map(item => {
      const found = byDate[dt].find(r=>r.item===item);
      return found ? found.amt : null;
    })
  );

  const rows = [];
  const newThursdays = thursdaysInMonth(year, month);
  newThursdays.forEach((day,i)=>{
    const dateStr = String(day).padStart(2,'0')+'/'+String(month).padStart(2,'0')+'/'+year;
    const weekVals = weeklyTemplates[i] || weeklyTemplates[weeklyTemplates.length-1] || [535.54,-21,-34,-36,-100];
    WEEKLY_ITEMS.forEach((item, idx)=>{
      if(weekVals[idx] !== null && weekVals[idx] !== undefined){
        rows.push({id:newId(), date:dateStr, item, amt:weekVals[idx], bold:false, removable:true});
      }
    });
  });

  // Copy every other (non-weekly) entry from the template month — rent, nursery,
  // Utility Warehouse, Universal Credit, withdrawals, one-off purchases, anything
  // manually added — shifting each to the same day-of-month, clamped to however
  // many days the new month actually has (so "last day of month" items like
  // nursery and UW automatically land on the new month's real last day).
  templateRows.forEach(r=>{
    if(WEEKLY_ITEMS.includes(r.item)) return;
    const origDay = d(r.date).getDate();
    const newDay = Math.min(origDay, newLastDay);
    const newDateStr = String(newDay).padStart(2,'0')+'/'+String(month).padStart(2,'0')+'/'+year;
    rows.push({id:newId(), date:newDateStr, item:swapMonthNameInText(r.item, newMonthName), amt:r.amt, bold:r.bold, removable:true});
  });

  S.transactions[key] = rows;

  // Auto-balance: nudge the month's biggest cash withdrawal up or down so the
  // closing balance lands within the usual £0–£65 target range, same approach
  // used when the original six months were set up by hand.
  if(typeof opening === 'number'){
    balanceMonthToTarget(key, opening);
  }
}

function balanceMonthToTarget(key, opening){
  const TARGET_MIN = 0, TARGET_MAX = 65;
  const targetMid = 20 + Math.random()*30; // land comfortably inside 0–65

  let raw = getMonthRowsRaw(key, opening);
  if(raw.closing >= TARGET_MIN && raw.closing <= TARGET_MAX) return;

  const list = S.transactions[key];
  const withdrawals = list.filter(r=>r.item==='Cash withdrawal').sort((a,b)=> d(b.date)-d(a.date)); // latest first
  if(withdrawals.length === 0) return;

  let remaining = Math.round((raw.closing - targetMid)/5)*5; // positive = need MORE withdrawn; negative = need LESS withdrawn

  if(remaining > 0){
    // Closing too high — increase the latest withdrawal to absorb all of it.
    withdrawals[0].amt -= remaining;
  } else if(remaining < 0){
    // Closing too low — claw money back by reducing withdrawals toward £0,
    // moving through as many as needed (can't un-withdraw below zero on any one).
    let need = -remaining; // positive amount we need to free up
    for(const w of withdrawals){
      if(need <= 0) break;
      const available = -w.amt; // how much this withdrawal could give back
      const take = Math.min(available, need);
      w.amt += take;
      need -= take;
    }
    // If still short after zeroing every withdrawal, that's a genuine shortfall
    // this month (expenses simply exceed income) — leave as-is rather than
    // fabricating money that isn't there.
  }
}

function getMonthRowsRaw(key, opening){
  const list = S.transactions[key] || [];
  const sorted = list.slice().sort((a,b)=> d(a.date)-d(b.date));
  let bal = opening;
  sorted.forEach(r=>{ bal += r.amt; });
  return {closing: bal};
}

function getMonthRows(key, opening){
  ensureMonthSeeded(key, opening);
  const list = S.transactions[key] || [];
  const sorted = list
    .map((r,i)=>({...r, _idx:i, _d:d(r.date)}))
    .sort((a,b)=> a._d-b._d || a._idx-b._idx);
  let bal = opening;
  const withBal = sorted.map(r=>{
    bal += r.amt;
    const {_idx,_d,...rest} = r;
    return {...rest, bal};
  });
  return {rows: withBal, closing: bal};
}

// Walk sequentially from the epoch month up to (and including) `uptoKey`,
// seeding any months that don't exist yet, so the opening balance for any
// month — however far in the future — is always correct.
function computeChain(uptoKey){
  if(uptoKey < EPOCH_KEY) uptoKey = EPOCH_KEY;
  const order = [];
  let k = EPOCH_KEY;
  const out = {};
  let opening = S.start_balance;
  while(true){
    const res = getMonthRows(k, opening);
    out[k] = res;
    order.push(k);
    opening = res.closing;
    if(k === uptoKey) break;
    k = shiftKey(k, 1);
  }
  return {order, data: out};
}

function findTxn(monthKey, id){
  const list = S.transactions[monthKey] || [];
  const idx = list.findIndex(t=>t.id===id);
  return {list, idx};
}

function moveTxnIfMonthChanged(fromKey, id){
  const {list, idx} = findTxn(fromKey, id);
  if(idx === -1) return fromKey;
  const txn = list[idx];
  const fd = d(txn.date);
  const correctKey = keyForDate(fd);
  if(correctKey !== fromKey){
    list.splice(idx,1);
    ensureMonthSeeded(correctKey);
    if(!S.transactions[correctKey]) S.transactions[correctKey] = [];
    S.transactions[correctKey].push(txn);
    return correctKey;
  }
  return fromKey;
}

let syncStatus = '';

async function cloudPush(){
  if(!S.jsonbin_key) return;
  const toSave = S;
  try{
    if(!S.jsonbin_id){
      const res = await fetch('https://api.jsonbin.io/v3/b', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':S.jsonbin_key,'X-Bin-Name':'terrys-budget'},
        body: JSON.stringify(toSave)
      });
      if(!res.ok) throw new Error('Create bin failed: '+res.status);
      const data = await res.json();
      S.jsonbin_id = data.metadata.id;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){}
      syncStatus = 'Synced (new cloud box created)';
    } else {
      const res = await fetch('https://api.jsonbin.io/v3/b/'+S.jsonbin_id, {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':S.jsonbin_key},
        body: JSON.stringify(toSave)
      });
      if(!res.ok) throw new Error('Update failed: '+res.status);
      syncStatus = 'Synced just now';
    }
  }catch(e){
    console.error('Cloud sync failed:', e);
    syncStatus = 'Cloud sync failed — saved locally only';
  }
  updateSyncStatusUI();
}

async function cloudPull(){
  if(!S.jsonbin_key || !S.jsonbin_id) return false;
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+S.jsonbin_id+'/latest', {
      headers:{'X-Master-Key':S.jsonbin_key}
    });
    if(!res.ok) throw new Error('Fetch failed: '+res.status);
    const data = await res.json();
    S = {...DEFAULTS, ...data.record, jsonbin_key:S.jsonbin_key, jsonbin_id:S.jsonbin_id};
    S.transactions = migrateTransactions(S.transactions);
    syncStatus = 'Loaded from cloud';
    return true;
  }catch(e){
    console.error('Cloud pull failed:', e);
    syncStatus = 'Could not reach cloud — using local copy';
    return false;
  }
}

function updateSyncStatusUI(){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = syncStatus;
}

const STORAGE_KEY = 'terrys-budget-tracker-v5';
let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    }catch(e){
      console.error('Local save failed:', e);
    }
    await cloudPush();
  }, 300);
}

function importBackup(file){

  reader.onload = (e)=>{
    try{
      const loaded = JSON.parse(e.target.result);

      S.transactions = migrateTransactions(S.transactions);
      saveState();

    }catch(err){

    }
  };
  reader.readAsText(file);
}

function getBalanceAsOfToday(){
  const today = new Date();
  today.setHours(0,0,0,0);
  let todayKey = keyForDate(today);
  if(todayKey < EPOCH_KEY) todayKey = EPOCH_KEY;
  const chain = computeChain(todayKey);
  const idx = chain.order.indexOf(todayKey);
  const opening = idx <= 0 ? S.start_balance : chain.data[chain.order[idx-1]].closing;
  const rows = chain.data[todayKey].rows;
  let bal = opening;
  for(const r of rows){
    if(d(r.date) <= today) bal = r.bal;
    else break; // rows are sorted ascending by date already
  }
  return {
    balance: bal,
    label: today.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
  };
}

function thursdaysBetween(startDate, endDate){
  const days = [];
  let d2 = new Date(startDate);
  // move to next Thursday on/after startDate
  while(d2.getDay() !== 4){ d2.setDate(d2.getDate()+1); }
  while(d2 <= endDate){
    days.push(new Date(d2));
    d2.setDate(d2.getDate()+7);
  }
  return days;
}

function toDDMMYYYYFromDate(dt){
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  return dd+'/'+mm+'/'+dt.getFullYear();
}

function goalWeeklyPlan(goal){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = d(goal.targetDate);
  const start = today > d(goal.createdAt) ? today : d(goal.createdAt);
  const weeks = thursdaysBetween(start, target);
  const weeksCount = Math.max(weeks.length, 1);
  const weeklyAmt = goal.amount / weeksCount;
  return {weeks, weeklyAmt};
}

function applyGoalSavings(goal){
  const {weeks, weeklyAmt} = goalWeeklyPlan(goal);
  goal.txnIds = [];
  weeks.forEach(dt=>{
    const dateStr = toDDMMYYYYFromDate(dt);
    const monthKey = keyForDate(dt);
    ensureMonthSeeded(monthKey);
    if(!S.transactions[monthKey]) S.transactions[monthKey] = [];
    const txn = {id:newId(), date:dateStr, item:`Savings: ${goal.name}`, amt:-Math.round(weeklyAmt*100)/100, bold:true, removable:true, goalId:goal.id};
    S.transactions[monthKey].push(txn);
    goal.txnIds.push(txn.id);
  });
  goal.applied = true;
}

function removeGoalSavings(goal){
  (goal.txnIds||[]).forEach(id=>{
    for(const monthKey in S.transactions){
      const idx = S.transactions[monthKey].findIndex(t=>t.id===id);
      if(idx !== -1){ S.transactions[monthKey].splice(idx,1); break; }
    }
  });
  goal.txnIds = [];
  goal.applied = false;
}

function savedSoFarForGoal(goal){
  const today = new Date(); today.setHours(0,0,0,0);
  let saved = 0;
  (goal.txnIds||[]).forEach(id=>{
    for(const monthKey in S.transactions){
      const txn = S.transactions[monthKey].find(t=>t.id===id);
      if(txn && d(txn.date) <= today){ saved += Math.abs(txn.amt); break; }
    }
  });
  return saved;
}

          : `<button class="primary" data-apply="${goal.id}">Spread across paydays</button>`
        }
        <button class="danger" data-delgoal="${goal.id}">Delete</button>
      </div>
    </div>`;
  });

  return html;
}

function renderChartsPanel(){
  const chain = computeChain(S.currentMonthKey);
  const points = chain.order.map(k=>({key:k, label:keyLabel(k).split(' ')[0].slice(0,3), closing:chain.data[k].closing}));

  const w = 340, h = 180, padL = 44, padR = 12, padT = 16, padB = 24;
  const vals = points.map(p=>p.closing);
  let min = Math.min(...vals, 0), max = Math.max(...vals, 10);
  if(min === max){ min -= 10; max += 10; }
  const range = max - min;
  const stepX = points.length > 1 ? (w - padL - padR) / (points.length - 1) : 0;
  const xFor = i => padL + i*stepX;
  const yFor = v => padT + (h - padT - padB) * (1 - (v - min) / range);

  const linePoints = points.map((p,i)=> `${xFor(i)},${yFor(p.closing)}`).join(' ');
  const zeroY = yFor(0);

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">`;
  svg += `<line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="var(--hairline)" stroke-width="1" stroke-dasharray="3,3"/>`;
  svg += `<polyline fill="none" stroke="var(--azure)" stroke-width="2.5" points="${linePoints}"/>`;
  points.forEach((p,i)=>{
    const x = xFor(i), y = yFor(p.closing);
    const isCurrent = p.key === S.currentMonthKey;
    svg += `<circle cx="${x}" cy="${y}" r="${isCurrent?5:3.5}" fill="${p.closing<0?'#D64545':'var(--azure)'}" stroke="#fff" stroke-width="1.5"/>`;
    svg += `<text x="${x}" y="${h-6}" font-size="9" fill="var(--ink-muted)" text-anchor="middle" font-family="Inter,sans-serif">${p.label}</text>`;
  });
  svg += `<text x="${padL-6}" y="${yFor(max)+3}" font-size="9" fill="var(--ink-muted)" text-anchor="end" font-family="Inter,sans-serif">£${Math.round(max)}</text>`;
  svg += `<text x="${padL-6}" y="${yFor(min)+3}" font-size="9" fill="var(--ink-muted)" text-anchor="end" font-family="Inter,sans-serif">£${Math.round(min)}</text>`;
  svg += `</svg>`;

  const latest = points[points.length-1];
  let html = `<div class="chart-card">
    <h3>Closing balance by month</h3>
    ${svg}
  </div>
  <div class="chart-card">
    <h3>Latest</h3>
    <div class="hero-sub" style="color:var(--text-secondary)">${keyLabel(latest.key)} closed at <strong style="color:var(--navy)">${fmt(latest.closing)}</strong></div>
  </div>`;
  return html;
}

function renderAll(){
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');

  if(currentScreen === 'home'){
    tabsEl.innerHTML = '';
    panelsEl.innerHTML = renderHomeScreen();
    panelsEl.querySelectorAll('.home-box').forEach(box=>{
      box.onclick = ()=>{
        currentScreen = box.dataset.screen;
        if(currentScreen === 'statements' && !currentTab){
          currentTab = S.currentMonthKey;
        }
        renderAll();
      };
    });
    return;
  }

  if(currentScreen === 'charts'){
    tabsEl.innerHTML = renderBackBar('Trends');
    document.getElementById('homeBackBtn').onclick = ()=>{ currentScreen = 'home'; renderAll(); };
    panelsEl.innerHTML = renderChartsPanel();
    return;
  }

  if(currentScreen === 'planning'){
    tabsEl.innerHTML = renderBackBar('Planning');
    document.getElementById('homeBackBtn').onclick = ()=>{ currentScreen = 'home'; renderAll(); };
    panelsEl.innerHTML = renderPlanningPanel();
    document.getElementById('addGoalBtn').onclick = ()=>{
      const nameEl = document.getElementById('goal-name');
      const amtEl = document.getElementById('goal-amount');
      const dateEl = document.getElementById('goal-date');
      if(!nameEl.value || !amtEl.value || !dateEl.value) return;
      const goal = {
        id: newId(),
        name: nameEl.value,
        amount: parseFloat(amtEl.value),
        targetDate: toDDMMYYYY(dateEl.value),
        createdAt: toDDMMYYYY(new Date().toISOString().slice(0,10)),
        applied: false,
        txnIds: []
      };
      S.goals.push(goal);
      saveState();
      renderAll();
    };
    panelsEl.querySelectorAll('button[data-apply]').forEach(btn=>{
      btn.onclick = ()=>{
        const goal = S.goals.find(g=>g.id===btn.dataset.apply);
        if(goal){ applyGoalSavings(goal); saveState(); renderAll(); }
      };
    });
    panelsEl.querySelectorAll('button[data-unapply]').forEach(btn=>{
      btn.onclick = ()=>{
        const goal = S.goals.find(g=>g.id===btn.dataset.unapply);
        if(goal){ removeGoalSavings(goal); saveState(); renderAll(); }
      };
    });
    panelsEl.querySelectorAll('button[data-delgoal]').forEach(btn=>{
      btn.onclick = ()=>{
        const goal = S.goals.find(g=>g.id===btn.dataset.delgoal);
        if(goal && goal.applied) removeGoalSavings(goal);
        S.goals = S.goals.filter(g=>g.id!==btn.dataset.delgoal);
        saveState();
        renderAll();
      };
    });
    return;
  }

  if(currentScreen === 'settings'){
    tabsEl.innerHTML = renderBackBar('Settings');
    document.getElementById('homeBackBtn').onclick = ()=>{ currentScreen = 'home'; renderAll(); };
    panelsEl.innerHTML = renderInputsPanel();
    panelsEl.querySelectorAll('input[data-key]').forEach(inp=>{
      inp.onchange = (e)=>{
        S[e.target.dataset.key] = parseFloat(e.target.value)||0;
        saveState();
        renderAll();
      };
    });
    document.getElementById('jsonbin-key').onchange = (e)=>{ S.jsonbin_key = e.target.value.trim(); saveState(); };
    document.getElementById('jsonbin-id').onchange = (e)=>{ S.jsonbin_id = e.target.value.trim(); saveState(); };
    document.getElementById('syncNowBtn').onclick = async ()=>{
      syncStatus = 'Syncing...';
      updateSyncStatusUI();
      if(S.jsonbin_id){
        const ok = await cloudPull();
        if(ok) renderAll();
      } else {
        await cloudPush();
        renderAll();
      }
    };
    document.getElementById('exportBtn').onclick = exportBackup;
    document.getElementById('importFile').onchange = (e)=>{
      if(e.target.files[0]) importBackup(e.target.files[0]);
    };
    panelsEl.querySelectorAll('button[data-restore]').forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.restore,10);
        const item = S.recycleBin[i];
        if(!item) return;
        const {_fromMonth, _deletedAt, ...txn} = item;
        ensureMonthSeeded(_fromMonth);
        if(!S.transactions[_fromMonth]) S.transactions[_fromMonth] = [];
        S.transactions[_fromMonth].push(txn);
        moveTxnIfMonthChanged(_fromMonth, txn.id);
        S.recycleBin.splice(i,1);
        saveState();
        renderAll();
      };
    });
    const emptyBinBtn = document.getElementById('emptyBinBtn');
    if(emptyBinBtn){
      emptyBinBtn.onclick = ()=>{
        S.recycleBin = [];
        saveState();
        renderAll();
      };
    }
    const resetAllBtn = document.getElementById('resetAllBtn');
    if(resetAllBtn){
      resetAllBtn.onclick = ()=>{
        const sure = confirm('This clears everything saved in this browser (all months, ticks, custom entries, cloud sync settings) and reloads the built-in defaults. This cannot be undone. Continue?');
        if(!sure) return;
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        try{ localStorage.removeItem('terrys-budget-tracker-v4'); }catch(e){}
        try{ localStorage.removeItem('terrys-budget-tracker-v3'); }catch(e){}
        try{ localStorage.removeItem('terrys-budget-tracker-v2'); }catch(e){}
        try{ localStorage.removeItem('terrys-budget-tracker-v1'); }catch(e){}
        location.reload();
      };
    }
    return;
  }

  // currentScreen === 'statements'
  const viewKey = currentTab || S.currentMonthKey;
  const chain = computeChain(viewKey);
  S._opening_ = {};
  for(let i=0;i<chain.order.length;i++){
    const k = chain.order[i];
    const prevClosing = i===0 ? S.start_balance : chain.data[chain.order[i-1]].closing;
    S._opening_[k] = prevClosing;
  }

  const rawCenter = S.currentMonthKey;
  const minCenterForWindow = shiftKey(EPOCH_KEY, 2);
  const centerKey = rawCenter < minCenterForWindow ? minCenterForWindow : rawCenter;
  const windowKeys = [-2,-1,0,1,2].map(o=>shiftKey(centerKey,o));

  let tabsHtml = `<button class="tab-arrow" id="homeBackBtn2" aria-label="Back to home">🏠</button>`;
  tabsHtml += `<button class="tab-arrow" id="prevMonthBtn" ${rawCenter<=EPOCH_KEY?'disabled':''} aria-label="Earlier months">◀</button>`;
  windowKeys.forEach(k=>{
    const active = (currentTab===k);
    tabsHtml += `<div class="tab ${active?'active':''}" data-tab="${k}">${keyLabel(k)}</div>`;
  });
  tabsHtml += `<button class="tab-arrow" id="nextMonthBtn" aria-label="Later months">▶</button>`;
  tabsEl.innerHTML = tabsHtml;

  document.getElementById('homeBackBtn2').onclick = ()=>{ currentScreen = 'home'; renderAll(); };
  tabsEl.querySelectorAll('.tab[data-tab]').forEach(t=>{
    t.onclick = ()=>{
      const key = t.dataset.tab;
      currentTab = key;
      S.currentMonthKey = key;
      renderAll();
    };
  });
  document.getElementById('prevMonthBtn').onclick = ()=>{
    const target = shiftKey(S.currentMonthKey, -1);
    if(target < EPOCH_KEY) return;
    S.currentMonthKey = target;
    currentTab = target;
    renderAll();
  };
  document.getElementById('nextMonthBtn').onclick = ()=>{
    S.currentMonthKey = shiftKey(S.currentMonthKey, 1);
    currentTab = S.currentMonthKey;
    renderAll();
  };

  {
    const key = currentTab;
    panelsEl.innerHTML = renderMonthPanel(key, chain.data[key]);

    panelsEl.querySelectorAll('input.chk[data-key]').forEach(cb=>{
      cb.onchange = (e)=>{
        const pkey = e.target.dataset.key;
        const tr = e.target.closest('tr');
        S.paid[pkey] = e.target.checked;
        saveState();
        if(e.target.checked){
          tr.classList.add('paid','fading');
          setTimeout(()=>{ if(S.paid[pkey]) tr.classList.add('hidden'); }, 260);
        } else {
          tr.classList.remove('hidden');
          void tr.offsetWidth;
          tr.classList.remove('fading','paid');
        }
        refreshPaidToggle(panelsEl);
      };
    });

    const showPaidBtn = panelsEl.querySelector('button[data-showpaid]');
    if(showPaidBtn){
      showPaidBtn.onclick = ()=>{
        const stmt = panelsEl.querySelector('.statement');
        const showing = stmt.classList.toggle('show-paid');
        showPaidBtn.textContent = showing ? 'Hide paid items' : showPaidBtn.dataset.label;
      };
    }

    panelsEl.querySelectorAll('button[data-remove]').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        const id = btn.dataset.remove;
        const {list, idx} = findTxn(key, id);
        if(idx !== -1){
          const [removed] = list.splice(idx,1);
          S.recycleBin.unshift({...removed, _fromMonth: key, _deletedAt: Date.now()});
          S.recycleBin = S.recycleBin.slice(0, 25);
        }
        saveState();
        renderAll();
      };
    });

    panelsEl.querySelectorAll('td[data-editcell]').forEach(cell=>{
      cell.onclick = ()=>{
        if(cell.querySelector('input')) return;
        const id = cell.dataset.id;
        const field = cell.dataset.editcell;
        const {list, idx} = findTxn(key, id);
        if(idx === -1) return;
        const txn = list[idx];
        const input = document.createElement('input');
        input.className = 'inline-input';
        if(field === 'date'){
          input.type = 'date';
          input.value = toISO(txn.date);
        } else {
          input.type = 'number';
          input.step = '0.01';
          input.value = txn.amt;
        }
        cell.textContent = '';
        cell.appendChild(input);
        input.focus();
        if(input.select) input.select();

        const commit = ()=>{
          if(field === 'date'){
            if(input.value){
              txn.date = toDDMMYYYY(input.value);
              moveTxnIfMonthChanged(key, id);
            }
          } else {
            const v = parseFloat(input.value);
            if(!isNaN(v)) txn.amt = v;
          }
          saveState();
          renderAll();
        };
        input.onblur = commit;
        input.onkeydown = (e)=>{
          if(e.key === 'Enter'){ input.blur(); }
          if(e.key === 'Escape'){ input.onblur = null; renderAll(); }
        };
      };
    });

    const addToggleBtn = panelsEl.querySelector('#addToggleBtn');
    const addFormBox = panelsEl.querySelector('#addFormBox');
    if(addToggleBtn && addFormBox){
      addToggleBtn.onclick = ()=>{
        const showing = addFormBox.classList.toggle('show');
        addToggleBtn.textContent = showing ? '×' : '+';
        addToggleBtn.setAttribute('aria-label', showing ? 'Close add entry form' : 'Add new entry');
      };
    }

    const addBtn = panelsEl.querySelector('button[data-addmonth]');
    if(addBtn){
      addBtn.onclick = ()=>{
        const m = addBtn.dataset.addmonth;
        const dateEl = document.getElementById('add-date-box');
        const itemEl = document.getElementById('add-item-box');
        const typeEl = document.getElementById('add-type-box');
        const amtEl = document.getElementById('add-amt-box');
        if(!dateEl.value || !itemEl.value || !amtEl.value) return;
        const amt = Math.abs(parseFloat(amtEl.value)) * (typeEl.value==='out' ? -1 : 1);
        ensureMonthSeeded(m);
        if(!S.transactions[m]) S.transactions[m] = [];
        const newTxn = {id:newId(), date:toDDMMYYYY(dateEl.value), item:itemEl.value, amt, bold:true, removable:true};
        S.transactions[m].push(newTxn);
        moveTxnIfMonthChanged(m, newTxn.id);
        saveState();
        renderAll();
      };
    }
  }
  adjustStickyOffsets();
}

function adjustStickyOffsets(){
  const tabsEl2 = document.getElementById('tabs');
  const panelHeader = document.querySelector('.panel-header');
  if(!tabsEl2) return;
  const tabsHeight = tabsEl2.getBoundingClientRect().height;
  if(panelHeader){
    panelHeader.style.top = tabsHeight + 'px';
    const panelHeaderHeight = panelHeader.getBoundingClientRect().height;
    document.querySelectorAll('th').forEach(th=>{
      th.style.top = (tabsHeight + panelHeaderHeight) + 'px';
    });
  }
}
window.addEventListener('resize', adjustStickyOffsets);

async function init(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      S = {...DEFAULTS, ...JSON.parse(raw)};
      S.transactions = migrateTransactions(S.transactions);
      if(!S.currentMonthKey || !/^\d{4}-\d{2}$/.test(S.currentMonthKey)){
        S.currentMonthKey = EPOCH_KEY;
      }
    } else {
      // check for older versions' storage keys and migrate their data across
      for(const oldKey of ['terrys-budget-tracker-v2','terrys-budget-tracker-v1']){
        const oldRaw = localStorage.getItem(oldKey);
        if(oldRaw){
          try{
            const oldData = JSON.parse(oldRaw);
            S = {...DEFAULTS, ...oldData};
            S.transactions = migrateTransactions(S.transactions || SEED_TRANSACTIONS);
            S.currentMonthKey = EPOCH_KEY;
            break;
          }catch(e){}
        }
      }
    }
  }catch(e){ console.error('Local load failed:', e); }
  if(S.jsonbin_key && S.jsonbin_id){
    await cloudPull();
  }
  renderAll();
}
init();
</script>
